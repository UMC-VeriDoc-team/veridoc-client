name: Sync develop to main

on:
  push:
    branches: [develop]

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      # 레포 체크아웃
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # develop이 main보다 앞서 있을 때만 PR 생성
      - name: Create PR (develop -> main) if needed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          git fetch origin --prune

          # develop이 main보다 몇 커밋 ahead인지 확인
          AHEAD="$(git rev-list --count origin/main..origin/develop)"
          echo "AHEAD(origin/main..origin/develop)=$AHEAD"

          if [ "$AHEAD" = "0" ]; then
            echo "No commits to sync. Exit."
            exit 0
          fi

          # 이미 열린 PR이 있으면 새로 만들지 않음
          EXISTS="$(gh pr list --base main --head develop --state open --json number --jq 'length')"
          echo "EXISTS_PR_COUNT=$EXISTS"

          if [ "$EXISTS" != "0" ]; then
            echo "PR already exists. Exit."
            exit 0
          fi

          # PR 생성
          gh pr create \
            --base main \
            --head develop \
            --title "chore: sync develop into main" \
            --body "develop 브랜치 변경사항을 main에 자동 반영하기 위한 PR입니다. merge되면 main push가 발생하고 Vercel 배포가 진행됩니다."

      # PR 자동 머지 활성화 (squash)
      - name: Enable PR auto-merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          PR_NUMBER="$(gh pr list --base main --head develop --state open --json number --jq '.[0].number')"
          echo "PR_NUMBER=$PR_NUMBER"

          if [ -z "$PR_NUMBER" ]; then
            echo "No PR to enable auto-merge. Exit."
            exit 0
          fi

          gh pr merge "$PR_NUMBER" --squash --auto